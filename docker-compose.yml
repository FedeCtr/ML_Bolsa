services:
  api:
    build: .
    container_name: mlbolsa-api
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://mlbolsa:mlbolsa@postgres:5432/mlbolsa
      - REDIS_URL=redis://redis:6379/0
      - SCHEDULER_EMBEDDED=${SCHEDULER_EMBEDDED:-0}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-ML_Bolsa <onboarding@resend.dev>}
      # Sprint 6: monetizacion (el frontend proxea /api/proxy/* a la API con API_INTERNAL_URL)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_PRO_AMOUNT=${STRIPE_PRICE_PRO_AMOUNT:-2900}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/pricing?status=success}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/pricing?status=cancel}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data        # paper trading, watchlists, cache raw
      - models-data:/app/models   # ensemble + calibracion + OOF
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # desde el navegador la API vive en localhost:8000 (mapeada del api)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: mlbolsa-frontend
    restart: unless-stopped
    environment:
      # proxy runtime /api/proxy/* -> API (el tier no queda horneado en el bundle)
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  scheduler:
    build: .
    container_name: mlbolsa-scheduler
    restart: unless-stopped
    command: python scripts/run_scheduler.py
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_MIGRATIONS=0   # las aplica el servicio api al arrancar
      - DATABASE_URL=postgresql+psycopg://mlbolsa:mlbolsa@postgres:5432/mlbolsa
      - REDIS_URL=redis://redis:6379/0
      - SCHEDULER_UNIVERSE=${SCHEDULER_UNIVERSE:-sp500}
      - SCHEDULER_PERIOD=${SCHEDULER_PERIOD:-3mo}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - app-data:/app/data
      - models-data:/app/models

  postgres:
    image: postgres:16-alpine
    container_name: mlbolsa-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mlbolsa
      - POSTGRES_PASSWORD=mlbolsa
      - POSTGRES_DB=mlbolsa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbolsa -d mlbolsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mlbolsa-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  models-data:
  postgres-data:
